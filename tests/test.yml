---
- name: Persist the FacetWP Cache db.php drop-in
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    site: example.com
    project: {}
    project_public_path: web
    project_upload_path: app/uploads
    project_shared_children:
      - path: "{{ project_public_path }}/{{ project_upload_path }}"
        src: uploads
  tasks:
    - name: Create a temporary Trellis project
      ansible.builtin.tempfile:
        state: directory
        suffix: trellis-facetwp-cache
      register: test_root

    - name: Point deploy_helper at it
      ansible.builtin.set_fact:
        deploy_helper:
          new_release_path: "{{ test_root.path }}/releases/1"
          shared_path: "{{ test_root.path }}/shared"

    - name: Create the release and shared directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ deploy_helper.new_release_path }}/web/app/plugins/facetwp-cache"
        - "{{ deploy_helper.shared_path }}"

    - name: Without the add-on, nothing changes
      block:
        - name: Run the role tasks
          ansible.builtin.include_tasks: ../tasks/main.yml  # noqa: no-relative-paths

        - name: Find files in the shared directory
          ansible.builtin.find:
            paths: "{{ deploy_helper.shared_path }}"
          register: test_shared_without_addon

        - name: Check nothing was stored or appended
          ansible.builtin.assert:
            that:
              - test_shared_without_addon.matched == 0
              - project_shared_children | length == 1

    - name: With the add-on, db.php is stored once and appended once
      block:
        - name: Install a stand-in for the add-on's db.php
          ansible.builtin.copy:
            content: "<?php // facetwp-cache db.php\n"
            dest: "{{ deploy_helper.new_release_path }}/web/app/plugins/facetwp-cache/db.php"
            mode: '0644'

        - name: Run the role tasks twice
          ansible.builtin.include_tasks: ../tasks/main.yml  # noqa: no-relative-paths
          loop: [1, 2]

        - name: Read the shared file
          ansible.builtin.slurp:
            src: "{{ deploy_helper.shared_path }}/facetwp-cache-db.php"
          register: test_shared_file

        - name: Check the shared file and the shared children
          ansible.builtin.assert:
            that:
              - test_shared_file.content | b64decode == "<?php // facetwp-cache db.php\n"
              - project_shared_children | length == 2
              - (project_shared_children | selectattr('path', 'equalto', 'web/app/db.php') | list | first).src == 'facetwp-cache-db.php'

    - name: Plugin updates are copied on the next deploy
      block:
        - name: Change the add-on's db.php
          ansible.builtin.copy:
            content: "<?php // updated\n"
            dest: "{{ deploy_helper.new_release_path }}/web/app/plugins/facetwp-cache/db.php"
            mode: '0644'

        - name: Run the role tasks
          ansible.builtin.include_tasks: ../tasks/main.yml  # noqa: no-relative-paths

        - name: Read the shared file
          ansible.builtin.slurp:
            src: "{{ deploy_helper.shared_path }}/facetwp-cache-db.php"
          register: test_shared_updated

        - name: Check the shared file was refreshed
          ansible.builtin.assert:
            that:
              - test_shared_updated.content | b64decode == "<?php // updated\n"

    - name: A site-level project_shared_children is refused
      block:
        - name: Run the role tasks with a site override
          ansible.builtin.include_tasks: ../tasks/main.yml  # noqa: no-relative-paths
          vars:
            project:
              project_shared_children: []

        - name: Fail the test, because the role did not refuse
          ansible.builtin.fail:
            msg: The role should refuse a site-level project_shared_children.
      rescue:
        - name: Check the role refused, and not something else
          ansible.builtin.assert:
            that:
              - "'takes precedence' in ansible_failed_result.msg"

    - name: A site-level project_shared_children with the db.php entry is accepted
      ansible.builtin.include_tasks: ../tasks/main.yml  # noqa: no-relative-paths
      vars:
        project:
          project_shared_children:
            - path: web/app/db.php
              src: facetwp-cache-db.php
              type: file

    - name: A conflicting db.php shared child is refused
      block:
        - name: Run the role tasks with a conflicting entry
          ansible.builtin.include_tasks: ../tasks/main.yml  # noqa: no-relative-paths
          vars:
            project:
              project_shared_children:
                - path: web/app/db.php
                  src: other-db.php
                  type: file

        - name: Fail the test, because the role did not refuse
          ansible.builtin.fail:
            msg: The role should refuse a conflicting db.php shared child.
      rescue:
        - name: Check the role refused, and not something else
          ansible.builtin.assert:
            that:
              - "'does not use' in ansible_failed_result.msg"

    - name: Remove the temporary project
      ansible.builtin.file:
        path: "{{ test_root.path }}"
        state: absent
